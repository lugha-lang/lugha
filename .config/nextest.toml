# cargo-nextest's settings. Locally `cargo test` stays the way to run the
# tests; CI runs them with nextest's `ci` profile, split across four jobs.

[profile.ci]
# Every test runs even after a failure, so one never hides another.
fail-fast = false
# Tests build and run programs through cc, zig and qemu: slow on a busy
# machine, but one still running after ten minutes is stuck.
slow-timeout = { period = "60s", terminate-after = 10 }
# A failure's output is printed where it happens and again in the summary.
failure-output = "immediate-final"

# Builds and runs every program twice (-O0 and -O2): six minutes alone on
# CI's machine, longer beside other tests.
[[profile.ci.overrides]]
filter = 'test(=run_programs_agree_at_o0_and_o2)'
slow-timeout = { period = "60s", terminate-after = 30 }

# The sweeps of every program: on Windows, where starting and linking a
# program is slow, they run a case per CPU and still take longer, so one
# sweep at a time: two at once would each starve the other's cases.
[[profile.ci.overrides]]
platform = 'cfg(windows)'
filter = 'test(=programs) | test(=programs_free_everything_they_make) | test(=concurrency_programs_pass_the_owner_check)'
slow-timeout = { period = "60s", terminate-after = 30 }
test-group = 'sweeps'

[test-groups]
sweeps = { max-threads = 1 }
