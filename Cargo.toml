[package]
name = "lugha"
version = "0.18.22"
edition = "2024"
rust-version = "1.99"
description = "Compiler for Lugha, a small statically typed language compiled through LLVM"
license-file = "LICENSE"
repository = "https://github.com/kithinjibrian/lugha"
# The VS Code extension (PRP-099) is Node, not part of the crate.
exclude = ["editors/"]

[[bin]]
name = "lughac"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
codespan-reporting = "0.13.1"
# Only the two CPUs lughac emits for: LLVM's Windows archive is built
# without the others, which inkwell's default features would link.
inkwell = { version = "0.10", default-features = false, features = [
    "llvm21-1-prefer-dynamic",
    "target-x86",
    "target-aarch64",
] }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
thiserror = "2.0.21"
