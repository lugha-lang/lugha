# fmt, clippy and the full test suite, on every push to main: a background
# safety net that merges never wait on. Runs in the same Ubuntu release as
# development, so LLVM 21 comes from the stock archive, with no third-party
# apt source.
#
# One job builds the tests once and archives them with cargo-nextest; four
# jobs run a quarter of them each from that archive, at the same time, and
# every test runs even after a failure. The VS Code extension's tests run
# beside them.
name: CI

on:
  push:
    branches: [main]
  # By hand: `gh workflow run CI --ref <branch>` or the Actions tab.
  workflow_dispatch:

# A newer push to main replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  CARGO_TERM_COLOR: always
  # tests/arm.rs and tests/musl.rs fail, not skip, when a tool is missing.
  LUGHA_CROSS_TESTS: required
  # The same nextest builds the archive and runs it.
  NEXTEST: nextest@0.9.152

jobs:
  build:
    name: Build, lint, archive the tests
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/system

      - name: Install Rust
        # The toolchain and its rustfmt/clippy come from rust-toolchain.toml,
        # installed now so the cache below is keyed on it.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: ${{ env.NEXTEST }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Doc tests
        # nextest runs every other test; it doesn't run doc tests.
        run: cargo test --doc

      - name: Archive the tests
        # The test binaries, lughac and their libraries, at paths under
        # target/ that the test jobs recreate in the same workspace.
        run: cargo nextest archive --archive-file nextest-archive.tar.zst

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # OpenSSL for Mac builds of TLS and crypto programs: the release
        # tests/openssl.sh pins, built with zig, kept until the script
        # (its version and checksum) or zig changes.
        id: openssl-mac
        with:
          path: openssl-mac
          key: openssl-mac-zig-0.17.1-${{ hashFiles('tests/openssl.sh') }}

      - name: Build OpenSSL for a Mac
        if: steps.openssl-mac.outputs.cache-hit != 'true'
        run: sh tests/openssl.sh aarch64-apple-darwin "$PWD/openssl-mac"

      - name: Name the Mac's OpenSSL
        # For the Mac builds below: the suite's TLS, HTTP and crypto cases
        # and tests/macos/openssl/.
        run: echo "LUGHA_OPENSSL_AARCH64_APPLE_DARWIN=$PWD/openssl-mac" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # OpenSSL for Windows builds, the same release, kept the same way.
        id: openssl-win
        with:
          path: openssl-win
          key: openssl-win-zig-0.17.1-${{ hashFiles('tests/openssl.sh') }}

      - name: Build OpenSSL for Windows
        if: steps.openssl-win.outputs.cache-hit != 'true'
        run: sh tests/openssl.sh x86_64-pc-windows-gnu "$PWD/openssl-win"

      - name: Name Windows' OpenSSL
        # For the Windows builds below: the suite's TLS, HTTP and crypto
        # cases and tests/windows/openssl/.
        run: echo "LUGHA_OPENSSL_X86_64_PC_WINDOWS_GNU=$PWD/openssl-win" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # OpenSSL for Windows on ARM64 builds, the same release, kept the
        # same way.
        id: openssl-win-arm64
        with:
          path: openssl-win-arm64
          key: openssl-win-arm64-zig-0.17.1-${{ hashFiles('tests/openssl.sh') }}

      - name: Build OpenSSL for Windows on ARM64
        if: steps.openssl-win-arm64.outputs.cache-hit != 'true'
        run: sh tests/openssl.sh aarch64-pc-windows-gnu "$PWD/openssl-win-arm64"

      - name: Name ARM64 Windows' OpenSSL
        run: echo "LUGHA_OPENSSL_AARCH64_PC_WINDOWS_GNU=$PWD/openssl-win-arm64" >> "$GITHUB_ENV"

      - name: Build the macOS cases
        # Built here, on Linux, through zig; the macos job runs them on a Mac.
        # Those in tests/macos/openssl/ need the OpenSSL above.
        run: |
          mkdir -p macos
          for f in tests/macos/*.la tests/macos/openssl/*.la; do
            name=$(basename "$f" .la)
            target/debug/lughac build "$f" --target aarch64-apple-darwin -o "macos/$name"
            cp "${f%.la}.stdout" "macos/$name.stdout"
          done
          # trust.la's certificates, made fresh here: no key is committed.
          sh tests/certs.sh macos/trust.certs

      - name: Build the Windows cases
        # Built here, on Linux, through zig, for x86-64 (windows/) and ARM64
        # (windows-arm64/); the windows job runs them on Windows. A case is
        # a .la file or a folder with main.la, beside what it must print
        # (.stdout), exit with (.exit), show on stderr (.stderr) and read
        # (.stdin). Those in tests/windows/openssl/ need the OpenSSL above.
        run: |
          for pair in windows:x86_64-pc-windows-gnu windows-arm64:aarch64-pc-windows-gnu; do
            dir=${pair%%:*}
            target=${pair#*:}
            mkdir -p "$dir"
            for f in tests/windows/*.la tests/windows/*/main.la tests/windows/openssl/*.la; do
              case $f in
                */main.la) name=$(basename "$(dirname "$f")") ;;
                *) name=$(basename "$f" .la) ;;
              esac
              target/debug/lughac build "$f" --target "$target" -o "$dir/$name.exe"
              for ext in stdout exit stderr stdin; do
                if [ -f "${f%.la}.$ext" ]; then cp "${f%.la}.$ext" "$dir/$name.$ext"; fi
                if [ -f "tests/windows/$name.$ext" ]; then cp "tests/windows/$name.$ext" "$dir/$name.$ext"; fi
              done
            done
            # trust.la's certificates, made fresh here: no key is committed.
            sh tests/certs.sh "$dir/trust.certs"
          done
          # The struct shapes against zig's C, run against Windows' own on
          # the ARM64 runner (Wine checks x86-64's in tests/windows.rs).
          LUGHA_CASES_OUT="$PWD/windows-arm64" cargo test --test windows_arm64 extern_structs

      - name: Build the program suite for a Mac and for Windows
        # Every run case in tests/programs/, a folder each, for
        # tests/suite.sh on the macos and windows jobs.
        run: |
          LUGHA_SUITE="$PWD/macos/suite" LUGHA_SUITE_TARGET=aarch64-apple-darwin \
            cargo test --test platform_suite -- --ignored
          LUGHA_SUITE="$PWD/windows/suite" LUGHA_SUITE_TARGET=x86_64-pc-windows-gnu \
            cargo test --test platform_suite -- --ignored
          LUGHA_SUITE="$PWD/windows-arm64/suite" LUGHA_SUITE_TARGET=aarch64-pc-windows-gnu \
            cargo test --test platform_suite -- --ignored

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-programs
          path: macos/
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-programs
          path: windows/
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm64-programs
          path: windows-arm64/
          retention-days: 1

  test:
    name: Tests ${{ matrix.part }}/4
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      # ThreadSanitizer turns ASLR off for its own process, through
      # personality(), which Docker's default seccomp filter refuses.
      options: --security-opt seccomp=unconfined
    strategy:
      # Every part runs to the end, so one failure never hides another.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      # The tests read the source tree (tests/programs/, docs/), at the
      # revision the archive was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/system

      - name: Make room for nextest
        # No Rust here: the archive holds everything built.
        run: |
          mkdir -p "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: ${{ env.NEXTEST }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zig's own cache (its C libraries and unwinder per target), kept
        # in lughac's cache root between runs.
        with:
          path: ~/.cache/lugha/zig
          key: zig-0.17.1-${{ hashFiles('runtime/**', 'src/link/zig.rs') }}-${{ matrix.part }}
          restore-keys: zig-0.17.1-

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive

      - name: Run part ${{ matrix.part }} of the tests
        # Extracted into the workspace, lughac lands at the path the tests
        # were compiled with (`env!("CARGO_BIN_EXE_lughac")`).
        # No core dumps: the runner pipes each to its crash collector, which
        # made a test that dies by SIGSEGV on purpose take over 10 seconds.
        run: |
          ulimit -c 0
          cargo-nextest nextest run --profile ci \
            --archive-file nextest-archive.tar.zst \
            --extract-to . --extract-overwrite --workspace-remap . \
            --partition slice:${{ matrix.part }}/4

  macos:
    name: macOS (Apple Silicon)
    needs: build
    # Apple Silicon, macOS 15: the programs need 14.4 or newer.
    runs-on: macos-15
    steps:
      # The suite's cases run from the repository's root, as on Linux.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-programs
          path: macos

      - name: Run the programs built on Linux
        # Each prints exactly its .stdout within a minute (macOS has no
        # `timeout`: perl's alarm ends a hung one), in an empty folder of
        # its own, since some make files (with the certificates the build
        # made for it, if any); `start` again with stdin closed;
        # lockdown reports what it applied.
        working-directory: macos
        run: |
          status=0
          limit() { perl -e 'alarm shift; exec @ARGV or die' 60 "$@"; }
          for expected in *.stdout; do
            exe="${expected%.stdout}"
            chmod +x "$exe"
            mkdir "$exe.d"
            if [ -d "$exe.certs" ]; then cp "$exe.certs"/* "$exe.d"/; fi
            if (cd "$exe.d" && limit ../"$exe" > ../"$exe.out") && diff -u "$expected" "$exe.out"; then
              echo "ok $exe"
            else
              echo "FAILED $exe"
              status=1
            fi
          done
          if limit ./start <&- > start.closed && diff -u start.stdout start.closed; then
            echo "ok start with stdin closed"
          else
            echo "FAILED start with stdin closed"
            status=1
          fi
          LUGHA_LOCKDOWN=report ./hello > /dev/null 2> lockdown.txt
          LUGHA_LOCKDOWN=report ./lockdown_held > /dev/null 2>> lockdown.txt
          if grep -q "lockdown: seatbelt applied, files not limited; net refused, proc refused, fs refused" lockdown.txt &&
             grep -q "lockdown: seatbelt not needed, files not limited; net held, proc held, fs refused" lockdown.txt; then
            echo "ok lockdown report"
          else
            cat lockdown.txt
            status=1
          fi
          exit $status

      - name: Run the program suite
        # Every run case built on Linux; tests/macos/known.txt lists the
        # ones expected to fail here, each with why.
        if: always()
        run: |
          chmod +x macos/suite/*/exe
          sh tests/suite.sh macos/suite tests/macos/known.txt

  windows:
    name: Windows (${{ matrix.cpu }})
    needs: build
    # The same steps on each CPU, each running what the build job made
    # for it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x64
            runner: windows-latest
            programs: windows-programs
          - cpu: ARM64
            runner: windows-11-arm
            programs: windows-arm64-programs
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # The cases read files beside them and compare bytes: no CRLF.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.programs }}
          path: windows

      - name: Run the programs built on Linux
        # Each with the arguments `a b` and `ñandú`, LUGHA_TEST_WIN=héllo
        # and its .stdin (else nothing), within a minute, in a folder of its
        # own holding only the certificates the build made for it, if any:
        # exactly its .stdout, its .exit (else 0), and its .stderr somewhere
        # in stderr. Lockdown reports what it limited.
        working-directory: windows
        env:
          LC_ALL: C.UTF-8
          LUGHA_TEST_WIN: héllo
        run: |
          # Some cases exit non-zero on purpose: their code is compared.
          set +e
          status=0
          for expected in *.stdout; do
            name="${expected%.stdout}"
            want=0
            if [ -f "$name.exit" ]; then want=$(cat "$name.exit"); fi
            input=/dev/null
            if [ -f "$name.stdin" ]; then input="$PWD/$name.stdin"; fi
            mkdir "$name.d"
            if [ -d "$name.certs" ]; then cp "$name.certs"/* "$name.d"/; fi
            (cd "$name.d" && timeout 60 ../"$name.exe" "a b" "ñandú" < "$input" > ../"$name.out" 2> ../"$name.err")
            got=$?
            if [ "$got" = "$want" ] && cmp -s "$expected" "$name.out" &&
               { [ ! -f "$name.stderr" ] || grep -qF -f "$name.stderr" "$name.err"; }; then
              echo "ok $name"
            else
              echo "FAILED $name: exit $got (want $want)"
              diff -u "$expected" "$name.out" || true
              cat "$name.err"
              if [ "$got" = 127 ]; then
                # Git Bash says 127 for any Windows status it has no signal
                # for, such as a fail-fast: run again, cmd reporting it.
                win=$(cd "$name.d" && cmd //v:on //c "..\\$name.exe a b < NUL > NUL 2>&1 & echo !errorlevel!" | tr -d '\r' | tail -n 1)
                case ${win#-} in
                  ''|*[!0-9]*) echo "  Windows exit status, run again: unknown ($win)" ;;
                  *) echo "  Windows exit status, run again: $(printf '0x%08X' $(( win & 0xFFFFFFFF )))" ;;
                esac
                # A fail-fast runs no handler of the program's: once more
                # under the system's debugger, which shows where it stopped
                # (the modules' bases map the program's frames).
                cdb=""
                for arch in arm64 x64; do
                  f="/c/Program Files (x86)/Windows Kits/10/Debuggers/$arch/cdb.exe"
                  if [ -x "$f" ]; then cdb="$f"; break; fi
                done
                if [ -n "$cdb" ]; then
                  (cd "$name.d" && printf '.symfix c:\\sym\n.reload\n.lastevent\n.exr -1\nr\nkn 40\nlm\nq\n' |
                    timeout 300 "$cdb" -g -lines ../"$name.exe" "a b" 2>&1 | tail -n 150)
                else
                  echo "  no cdb on this runner"
                fi
              fi
              status=1
            fi
          done
          LUGHA_LOCKDOWN=report ./hello.exe > /dev/null 2> lockdown.txt
          LUGHA_LOCKDOWN=report ./lockdown_held.exe > /dev/null 2>> lockdown.txt
          if grep -q "lockdown: processes refused, files read-only, network not limited; net refused, proc refused, fs refused" lockdown.txt &&
             grep -q "lockdown: nothing needed, network not limited; net refused, proc held, fs held" lockdown.txt; then
            echo "ok lockdown report"
          else
            echo "FAILED lockdown report"
            cat lockdown.txt
            status=1
          fi
          exit $status

      - name: Run the program suite
        # Every run case built on Linux; tests/windows/known.txt lists the
        # ones expected to fail here, each with why. Git Bash would turn
        # arguments that look like paths (`/c`) into Windows paths on their
        # way to a Windows program: not here.
        if: always()
        env:
          MSYS_NO_PATHCONV: "1"
        run: sh tests/suite.sh windows/suite tests/windows/known.txt

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        # The VS Code extension's tests; Node from the Ubuntu archive.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm ca-certificates

      - name: Test the extension
        # Its keyword test reads the spec, so it runs on every change; the
        # language server itself is tested by the Rust tests (tests/lsp.rs).
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
