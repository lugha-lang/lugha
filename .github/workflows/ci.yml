# fmt, clippy and the full test suite, on every push to main: a background
# safety net that merges never wait on. Runs in the same Ubuntu release as
# development, so LLVM 21 comes from the stock archive, with no third-party
# apt source.
name: CI

on:
  push:
    branches: [main]
  # By hand: `gh workflow run CI --ref <branch>` or the Actions tab.
  workflow_dispatch:

# A newer push to main replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TERM_COLOR: always
      # tests/arm.rs and tests/musl.rs fail, not skip, when a tool is missing.
      LUGHA_CROSS_TESTS: required
    steps:
      - name: Install system packages
        # llvm-21-dev: inkwell's LLVM (DECISION-005, linked dynamically).
        # build-essential: `cc` compiles the runtime and the bundled collector
        # (no libgc-dev: milestone 131) and links every test program.
        # qemu-user: runs ARM64 builds (tests/arm.rs, tests/musl.rs);
        # libc6-arm64-cross: the ARM64 glibc qemu loads for glibc builds.
        # xz-utils: unpacks zig. curl and ca-certificates: rustup's and zig's
        # downloads. git: a real checkout.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            llvm-21-dev build-essential libc6-arm64-cross qemu-user xz-utils curl ca-certificates git libssl-dev openssl

      - name: Install zig
        # Builds for other platforms go through `zig cc`. The tarball is
        # checked against the SHA-256 ziglang.org publishes before unpacking.
        env:
          ZIG: zig-x86_64-linux-0.17.1
          ZIG_SHA256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/zig.tar.xz "https://ziglang.org/download/0.17.1/$ZIG.tar.xz"
          echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig
          echo "/opt/zig/$ZIG" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        # The toolchain and its rustfmt/clippy come from rust-toolchain.toml.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Install Node
        # The VS Code extension's tests (PRP-099, PRP-100); Node from the Ubuntu archive.
        run: apt-get install -y --no-install-recommends nodejs npm

      - name: VS Code extension
        # Its keyword test reads the spec, so it runs on every change; the
        # language server itself is tested by `cargo test` (tests/lsp.rs).
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
